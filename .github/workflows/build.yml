name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine64 xvfb
      - name: Build the examples and run the tests
        run: bash tests/build_check.sh
